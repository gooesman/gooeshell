name: gooeshell Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/gooeshell-windows.yml'
      - 'gooeshell-files/tests-support/**'
permissions:
  contents: read
concurrency:
  group: gooeshell-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win
            arch: x64
          - runner: macos-15
            target: mac
            arch: arm64
          - runner: macos-15-intel
            target: mac
            arch: x64
          - runner: ubuntu-24.04
            target: linux
            arch: x64
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version and native architecture
        run: node scripts/ci-artifacts.mjs verify ${{ matrix.target }} ${{ matrix.arch }}
      - run: npm ci --no-audit --no-fund
      - name: Install disposable SSH fixture
        run: python -m pip install --disable-pip-version-check -r ../gooeshell-files/tests-support/requirements.txt
      - name: Install Linux display and Chinese font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 fonts-noto-cjk
      - name: SSH, SFTP, permissions and application tests
        run: node scripts/ci-tests.mjs
      - name: Build native desktop packages
        run: npm run pack -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Editor keyboard, drafts and native close regression
        if: runner.os != 'Linux'
        run: node scripts/ci-editor-tests.mjs
      - name: Editor regression on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci-editor-tests.mjs
      - name: Launch packaged application
        if: runner.os != 'Linux'
        run: node scripts/ci-smoke.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - name: Launch packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci-smoke.mjs ${{ matrix.target }} ${{ matrix.arch }}
      - name: Bundle Windows portable directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          git rev-parse HEAD | Set-Content -LiteralPath release/win-unpacked/BUILD.txt
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/gooeshell-$version-win-x64.zip"
      - name: Prepare checksums and build provenance
        run: node scripts/ci-artifacts.mjs collect ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: gooeshell-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop/release/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/test-output/ci-*/fixture*.log
            desktop/test-output/smoke-*.json
            desktop/test-output/editor-main-*/result.json
            .build/editor-render-*/result.json*
          if-no-files-found: ignore
          retention-days: 14
