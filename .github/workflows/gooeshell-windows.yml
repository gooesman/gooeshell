name: gooeshell Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/gooeshell-windows.yml'
      - 'gooeshell-files/tests-support/**'
permissions:
  contents: read
concurrency:
  group: gooeshell-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: SSH, SFTP and permission tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r ../gooeshell-files/tests-support/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path test-output -Force | Out-Null
          $ready = Join-Path $pwd 'test-output/sftp.ready'
          $server = Start-Process -FilePath (Get-Command python).Source -WindowStyle Hidden -PassThru -ArgumentList @('../gooeshell-files/tests-support/sftp_fixture.py','--root','test-output/sftp','--ready',$ready,'--lifetime','600') -RedirectStandardOutput test-output/fixture.log -RedirectStandardError test-output/fixture-error.log
          try {
            for ($i=0; $i -lt 100 -and -not (Test-Path -LiteralPath $ready); $i++) {
              if ($server.HasExited) { Get-Content test-output/fixture-error.log; throw 'Fixture failed' }
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path -LiteralPath $ready)) { throw 'Fixture was not ready' }
            $env:GOOESHELL_SFTP_TEST_READY = $ready
            npm test
            if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          } finally { New-Item -ItemType File -Path "$ready.stop" -Force | Out-Null }
      - name: Build Windows portable application
        run: npm run pack
      - name: Bundle portable directory
        shell: pwsh
        run: |
          git rev-parse HEAD | Set-Content release/win-unpacked/BUILD.txt
          Compress-Archive -Path release/win-unpacked/* -DestinationPath release/gooeshell-windows-x64.zip
          Get-FileHash release/gooeshell-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gooeshell-windows-x64
          path: |
            desktop/release/gooeshell-windows-x64.zip
            desktop/release/SHA256.txt
          retention-days: 30
  linux-helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --import tsx --test tests/remote-helper.test.ts tests/store.test.ts tests/local-files-store.test.ts tests/ssh-session.test.ts tests/terminal-flow.test.ts
