name: GooeShell Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gooeshell-desktop-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: desktop
jobs:
  linux-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r ../test-support/ssh/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tmux openssh-server rsync fonts-noto-cjk
      - name: Real sudo task fallback regression in disposable container
        run: docker run --rm -v "$PWD:/fixture:ro" --entrypoint /bin/sh ubuntu:22.04 /fixture/tests/fixtures/fallback-real-sudo-container.sh
      - name: Real server-to-server SSH transfer and cleanup regression
        env:
          GOOESHELL_SERVER_TRANSFER_TEST: '1'
        run: node node_modules/tsx/dist/cli.mjs --test tests/server-transfer-integration.test.ts
      - name: SSH, SFTP, permissions and application tests
        run: node scripts/ci-tests.mjs
  win-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version and native architecture
        run: node scripts/ci-artifacts.mjs verify win x64
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r ../test-support/ssh/requirements.txt
      - name: SSH, SFTP, permissions and application tests
        run: node scripts/ci-tests.mjs
      - name: Build Windows desktop application
        run: npm run pack -- --win --x64
      - name: Editor keyboard, drafts and native close regression
        run: node scripts/ci-editor-tests.mjs
      - name: Connections, credentials and reconnect regression
        run: node scripts/ci-connection-tests.mjs
      - name: Commands and terminal palettes regression
        run: node scripts/ci-command-tests.mjs
      - name: Files and paste regression
        run: node scripts/ci-workspace-tests.mjs
      - name: Launch packaged application
        run: node scripts/ci-smoke.mjs win x64
      - name: Bundle Windows portable directory
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          git rev-parse HEAD | Set-Content -LiteralPath release/win-unpacked/BUILD.txt
          Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/GooeShell-$version-win-x64.zip"
      - name: Extract and launch Windows portable ZIP
        run: node scripts/ci-package-check.mjs win x64
      - name: Prepare checksums and build provenance
        run: node scripts/ci-artifacts.mjs collect win x64
      - uses: actions/upload-artifact@v4
        with:
          name: gooeshell-win-x64
          path: desktop/release/artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-win-x64
          include-hidden-files: true
          path: |
            desktop/test-output/ci-*/fixture*.log
            desktop/test-output/smoke-*.json
            desktop/test-output/package-install-*.json
            desktop/test-output/editor-main-*/result.json
            .build/editor-render-*/result.json*
            desktop/test-output/connection-main-*/result.json
            desktop/test-output/mcp-main-*/result.json
            desktop/test-output/mcp-settings-*.png
            desktop/test-output/reload-shortcuts-*/result.json
            .build/connection-ui-*/result.json*
            .build/connections-flow-*/result.json*
            .build/terminal-reconnect-*/result.json*
            .build/app-connections-*/result.json*
            desktop/test-output/command-main-*/result.json
            .build/command-ui-*/result.json*
            .build/terminal-palettes-*/result.json*
            .build/app-explorer-*/result.json*
            .build/terminal-paste-*/result.json*
            .build/terminal-tabs-*/result.json*
            .build/explorer-performance-*/result.json*
            .build/terminal-output-*/result.json*
            .build/terminal-command-marks-*/result.json*
            desktop/test-output/single-instance-*/*.json
            desktop/test-output/local-pty-native-*/result.json
            .build/local-terminal-app-*/result.json*
          if-no-files-found: ignore
          retention-days: 14
