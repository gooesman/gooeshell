name: Prepare gooeshell draft release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch desktop build run ID
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: gooeshell-draft-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  upload-verified-packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify packages and upload to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          GOOESHELL_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GOOESHELL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node ci/gooeshell-publish.mjs
