name: 问题反馈
description: 报告 GooeShell 的连接、终端、文件或界面问题。
body:
  - type: input
    id: version
    attributes:
      label: GooeShell 版本
      placeholder: 例如 1.3.5
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与架构
      placeholder: 例如 Windows 11 x64 / macOS 15 arm64 / Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请说明操作入口、实际结果和期望结果。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 报错与补充信息
      description: 可附截图或日志。请移除密码、私钥、令牌、真实地址和敏感输出；无需上传完整配置。
